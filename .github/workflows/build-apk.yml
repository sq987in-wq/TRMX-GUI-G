name: Build and Release Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          JAVA_MAJOR=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}' | awk -F '.' '{print $1}')
          echo "Active Java major version: ${JAVA_MAJOR}"
          if [ "${JAVA_MAJOR}" -lt 17 ]; then
            echo "Error: Java 17 or higher is required, but found version ${JAVA_MAJOR}."
            exit 1
          fi
          java -version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ ! -f ./debug.keystore ]; then
            echo "Generating temporary debug keystore..."
            keytool -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          else
            echo "debug.keystore already exists."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK exists
        run: |
          if [ ! -f "app/build/outputs/apk/debug/app-debug.apk" ]; then
            echo "Error: Debug APK not found at app/build/outputs/apk/debug/app-debug.apk"
            exit 1
          fi
          echo "Debug APK located successfully:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare release asset
        run: |
          REPO_NAME="${GITHUB_REPOSITORY#*/}"
          RELEASE_DIR="${RUNNER_TEMP}/release_assets"
          mkdir -p "${RELEASE_DIR}"
          ASSET_NAME="${REPO_NAME}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${RELEASE_DIR}/${ASSET_NAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "${ASSET_PATH}"
          echo "ASSET_NAME=${ASSET_NAME}" >> "$GITHUB_ENV"
          echo "ASSET_PATH=${ASSET_PATH}" >> "$GITHUB_ENV"
          echo "Prepared release asset: ${ASSET_PATH}"

      - name: Publish to GitHub Releases
        continue-on-error: true
        id: github_release
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }} (Attempt ${{ github.run_attempt }})"

          echo "Publishing release with tag: ${TAG_NAME}"
          gh release create "${TAG_NAME}" "${ASSET_PATH}" \
            --title "${RELEASE_TITLE}" \
            --notes "Automated debug APK build from commit \`${{ github.sha }}\` on branch \`${{ github.ref_name }}\`." \
            --latest

      - name: Report APK download result in GITHUB_STEP_SUMMARY
        if: always()
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          APK_PATH="app/build/outputs/apk/debug/app-debug.apk"

          echo "## 📱 Android Debug APK Build & Release Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [ -f "$APK_PATH" ]; then
            APK_SIZE=$(du -h "$APK_PATH" | cut -f1)
            APK_SHA256=$(sha256sum "$APK_PATH" | cut -d' ' -f1)

            echo "### ✅ Build Status: SUCCESS" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "| Property | Details |" >> "$GITHUB_STEP_SUMMARY"
            echo "| :--- | :--- |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Repository** | \`${GITHUB_REPOSITORY}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Run Number** | \`#${{ github.run_number }}\` (Attempt \`${{ github.run_attempt }}\`) |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **Commit** | \`${{ github.sha }}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **File Name** | \`${ASSET_NAME:-app-debug.apk}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **File Size** | \`${APK_SIZE}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "| **SHA256 Checksum** | \`${APK_SHA256}\` |" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "### 📥 Download Options" >> "$GITHUB_STEP_SUMMARY"
            echo "- **Artifact**: Download [app-debug-apk](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) under the workflow Run Summary." >> "$GITHUB_STEP_SUMMARY"
            echo "- **GitHub Release**: Download directly as an asset from release [\`${TAG_NAME}\`](${{ github.server_url }}/${{ github.repository }}/releases/tag/${TAG_NAME})." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### ❌ Build Status: FAILED" >> "$GITHUB_STEP_SUMMARY"
            echo "The debug APK artifact was not produced. Please check step logs above for compiler or Gradle errors." >> "$GITHUB_STEP_SUMMARY"
          fi
